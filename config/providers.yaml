# 每个供应商的限流、重试与配额。密钥不在这里——它只在出网代理层。
tushare:
  base_url: https://api.tushare.pro
  rate_limit_qpm: 200
  daily_quota: 50000
  timeout_s: 30
  retry:
    max_attempts: 4
    backoff_base_s: 1.0
  cost_per_call_cents: 0

edgar:
  base_url: https://data.sec.gov
  rate_limit_qpm: 540        # SEC 要求 ≤ 10 req/s
  daily_quota: 200000
  timeout_s: 30
  retry:
    max_attempts: 4
    backoff_base_s: 1.0
  cost_per_call_cents: 0

siliconflow:
  # 嵌入与重排（adr/0004）。这里的 base_url 是生产域名，仅供文档与限流/
  # 配额参数的唯一来源用——实际连接地址由 SILICONFLOW_BASE_URL 指向回环
  # 反向代理（infra/egress-proxy），adapters/siliconflow.py::client_from_config
  # 用调用方传入的 base_url 覆盖这里的值，密钥只在代理层。
  base_url: https://api.siliconflow.cn
  rate_limit_qpm: 1000
  daily_quota: 20000
  timeout_s: 60              # 批量嵌入比行情接口慢
  retry:
    max_attempts: 4
    backoff_base_s: 1.0
  cost_per_call_cents: 0

deepseek:
  # 生成模型（表格描述等，阶段 3.1）。base_url 是生产域名，仅供限流 / 配额参数的唯一来源；
  # 实际连接地址由 MODEL_BASE_URL 指向回环反向代理（infra/docker-compose.yml 的 8086 端口），
  # 密钥（MODEL_API_KEY）只在代理层，由代理以 Bearer 头注入。
  base_url: https://api.deepseek.com
  rate_limit_qpm: 120
  daily_quota: 20000
  timeout_s: 60
  retry:
    max_attempts: 3
    backoff_base_s: 2.0
  cost_per_call_cents: 0

parse_paddle:
  # 自托管 PaddleOCR（PP-StructureV3）薄壳，解析分级路由计划 T5。引擎容器在 internal 网络、
  # 运行期无外网、无密钥；这里的 base_url 只是占位，实际地址由 PARSE_PADDLE_BASE_URL 提供。
  base_url: http://127.0.0.1:8091
  rate_limit_qpm: 600
  daily_quota: 200000
  timeout_s: 180            # CPU 上单页可能数十秒；超时按 EngineUnavailable 降级
  retry:
    max_attempts: 2
    backoff_base_s: 2.0
  cost_per_call_cents: 0

parse_mineru:
  base_url: http://127.0.0.1:8092
  rate_limit_qpm: 600
  daily_quota: 200000
  timeout_s: 300
  retry:
    max_attempts: 2
    backoff_base_s: 2.0
  cost_per_call_cents: 0

parse_docling:
  # 仅基准对照（中文偏弱），不进生产路由。
  base_url: http://127.0.0.1:8093
  rate_limit_qpm: 600
  daily_quota: 200000
  timeout_s: 300
  retry:
    max_attempts: 2
    backoff_base_s: 2.0
  cost_per_call_cents: 0
