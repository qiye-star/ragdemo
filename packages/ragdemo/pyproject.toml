[project]
name = "ragdemo"
version = "0.1.0"
description = "AI 产业链时点研究引擎 · 业务层：种子导入、CLI，以及 P1+ 的接入/检索/Agent"
requires-python = ">=3.11"
dependencies = [
    "ragdemo-core",
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "dagster>=1.8",
    # 向量召回（adr/0009）。只用本地自建实例，不连 Chroma Cloud——境内存储硬约束。
    "chromadb>=0.5",
    # 内网只读诊断接口（adr/0010）：纯 GET，无写路由。
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    # 本地读 PDF 页数（公告双源接入计划 Task 4：解析前先知道真实页数，用于费用估算
    # 与 PageBudget 判定），不解析内容，不依赖任何外部服务。
    "pypdf>=5.0",
]

[project.scripts]
ragdemo = "ragdemo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdemo"]
