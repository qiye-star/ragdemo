[project]
name = "ragdemo"
version = "0.1.0"
description = "AI 产业链时点研究引擎 · 业务层：种子导入、CLI，以及 P1+ 的接入/检索/Agent"
requires-python = ">=3.11"
dependencies = [
    "ragdemo-core",
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "dagster>=1.8",
    # 阶段 4.1：Dagster 常驻进程把运行 / 事件 / 调度状态存进 ParadeDB 的 dagster schema；
    # 容器里跑 dagster-webserver + dagster-daemon，都是运行时依赖（不只是 dev）。
    "dagster-postgres>=0.24",
    "dagster-webserver>=1.8",
    # 向量召回（adr/0009）。只用本地自建实例，不连 Chroma Cloud——境内存储硬约束。
    "chromadb>=0.5",
    # 内网只读诊断接口（adr/0010）：纯 GET，无写路由。
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    # 本地读 PDF 页数（公告双源接入计划 Task 4：解析前先知道真实页数，用于费用估算
    # 与 PageBudget 判定），不解析内容，不依赖任何外部服务。
    "pypdf>=5.0",
    # 本地版面解析（解析降本计划 Task 2）：词坐标 + 文字层。MIT 许可；
    # 不用 PyMuPDF——AGPL-3.0，与闭源分发不兼容。
    "pdfplumber>=0.11",
]

[project.scripts]
ragdemo = "ragdemo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdemo"]
