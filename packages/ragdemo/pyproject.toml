[project]
name = "ragdemo"
version = "0.1.0"
description = "AI 产业链时点研究引擎 · 业务层：种子导入、CLI，以及 P1+ 的接入/检索/Agent"
requires-python = ">=3.11"
dependencies = [
    "ragdemo-core",
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "dagster>=1.8",
]

[project.scripts]
ragdemo = "ragdemo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdemo"]
