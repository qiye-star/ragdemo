services:
  paradedb:
    # 版本固定，不用 latest。升级时必须重跑 P0 全部测试，见 docs/02-data-model.md §5.5
    # 与 adr/0001 的后果 2。
    image: paradedb/paradedb:0.25.9-pg18
    container_name: ragdemo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragdemo}
      POSTGRES_DB: ragdemo
    ports:
      # 只绑回环地址，不暴露公网（docs/01-architecture.md §4：端口不对公网开放）。
      # 宿主端口默认 5433 而非 5432：开发机上 5432 常被既有 postgres 占用，
      # 撞端口会让 `make up` 直接起不来。容器内仍是标准 5432。
      - "127.0.0.1:${RAGDEMO_DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ 的官方镜像把数据放在 /var/lib/postgresql/<major>/docker，
      # 挂载点必须是 /var/lib/postgresql 而不是它下面的 data/。
      # 挂到 .../data 会让容器以 exit 1 启动失败（实测，见 docs/02-data-model.md §5.5）。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdemo"]
      interval: 3s
      timeout: 3s
      retries: 20

  chroma:
    # 版本固定，不用 latest（理由同 paradedb：版本漂移会让行为静默改变）。
    # 版本号对齐 packages/ragdemo/pyproject.toml 锁定的 chromadb 客户端版本
    # （见 uv.lock 中 chromadb 的解析结果），避免服务端与客户端协议不一致。
    # adr/0009：Chroma 只承担向量候选生成，pgvector/PG 仍是系统真相与时点权威；
    # 因此 Chroma 只能本地自建（这里），不得使用 Chroma Cloud（CLAUDE.md §0 数据境内存储）。
    image: chromadb/chroma:1.5.9
    container_name: ragdemo-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      # 关闭匿名遥测：不把任何调用信息发到境外服务（CLAUDE.md §0 数据境内存储）。
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # 只绑回环地址，不暴露公网，理由同 paradedb。
      # 宿主端口默认 8001 而非官方镜像默认的 8000：8000 在开发机上常被其他服务占用。
      - "127.0.0.1:${RAGDEMO_CHROMA_PORT:-8001}:8000"
    volumes:
      # 官方镜像把持久化数据放在 /data，挂具名 volume 而不是匿名 volume，
      # 这样容器重建（升级镜像版本、`docker compose down` 不带 -v）不会丢数据。
      - chromadata:/data
    healthcheck:
      # 镜像内没有 curl/wget，用镜像自带的 python 探活 v2 heartbeat 接口。
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/api/v2/heartbeat')\""
      interval: 3s
      timeout: 3s
      retries: 20

  egress-proxy:
    build: ./egress-proxy
    container_name: ragdemo-egress
    environment:
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  chromadata:
