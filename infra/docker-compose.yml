services:
  paradedb:
    # 版本固定，不用 latest。升级时必须重跑 P0 全部测试，见 docs/02-data-model.md §5.5
    # 与 adr/0001 的后果 2。
    image: paradedb/paradedb:0.25.9-pg18
    container_name: ragdemo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragdemo}
      POSTGRES_DB: ragdemo
    # 关闭并行：pg_search 0.25.9 的并行 worker 会间歇崩溃（退出码 2），触发整库崩溃恢复——
    # 并行构建 bm25 索引（迁移 004 / 建测试库时）和并行查询都中过（2026-09-29/30 共 7 次，
    # 见 docs/9.28-plan/验收记录/phase-8）。当前数据量下并行收益可忽略。镜像默认 CMD 是 postgres。
    command:
      - postgres
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - max_parallel_workers_per_gather=0
    ports:
      # 只绑回环地址，不暴露公网（docs/01-architecture.md §4：端口不对公网开放）。
      # 宿主端口默认 5433 而非 5432：开发机上 5432 常被既有 postgres 占用，
      # 撞端口会让 `make up` 直接起不来。容器内仍是标准 5432。
      - "127.0.0.1:${RAGDEMO_DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ 的官方镜像把数据放在 /var/lib/postgresql/<major>/docker，
      # 挂载点必须是 /var/lib/postgresql 而不是它下面的 data/。
      # 挂到 .../data 会让容器以 exit 1 启动失败（实测，见 docs/02-data-model.md §5.5）。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdemo"]
      interval: 3s
      timeout: 3s
      retries: 20

  chroma:
    # 版本固定，不用 latest（理由同 paradedb：版本漂移会让行为静默改变）。
    # 版本号对齐 packages/ragdemo/pyproject.toml 锁定的 chromadb 客户端版本
    # （见 uv.lock 中 chromadb 的解析结果），避免服务端与客户端协议不一致。
    # adr/0009：Chroma 只承担向量候选生成，pgvector/PG 仍是系统真相与时点权威；
    # 因此 Chroma 只能本地自建（这里），不得使用 Chroma Cloud（CLAUDE.md §0 数据境内存储）。
    image: chromadb/chroma:1.5.9
    container_name: ragdemo-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      # 关闭匿名遥测：不把任何调用信息发到境外服务（CLAUDE.md §0 数据境内存储）。
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # 只绑回环地址，不暴露公网，理由同 paradedb。
      # 宿主端口默认 8001 而非官方镜像默认的 8000：8000 在开发机上常被其他服务占用。
      - "127.0.0.1:${RAGDEMO_CHROMA_PORT:-8001}:8000"
    volumes:
      # 官方镜像把持久化数据放在 /data，挂具名 volume 而不是匿名 volume，
      # 这样容器重建（升级镜像版本、`docker compose down` 不带 -v）不会丢数据。
      - chromadata:/data
    healthcheck:
      # chromadb/chroma:1.5.9 是精简 Debian 镜像：既没有 curl/wget，**也没有 python**
      # （实测 `python -c ...` 探针一律 exit 127 "python: not found"，容器永远 unhealthy，
      # 而 `make up` 用的是 `up -d --wait`，会一直卡到超时）。
      # 镜像里有 bash，用它的 /dev/tcp 直接发一个 HTTP/1.0 请求并断言 200——
      # 只探端口通不够，进程起来但路由没注册时端口也是通的。
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 3s
      timeout: 3s
      retries: 20

  egress-proxy:
    build: ./egress-proxy
    container_name: ragdemo-egress
    environment:
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      TEXTIN_APP_ID: ${TEXTIN_APP_ID:-}
      TEXTIN_SECRET_CODE: ${TEXTIN_SECRET_CODE:-}
      WIND_MCP_TOKEN: ${WIND_MCP_TOKEN:-}
      IFIND_MCP_TOKEN: ${IFIND_MCP_TOKEN:-}
      # stdout 不是终端时 Python 会整块缓冲，出网日志要实时可见才有审计意义。
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8080:8080"
      # Phase 1B 新增：TextIn 专用反向代理端口。回环明文进、TLS 出到
      # api.textin.com，不需要信任 mitmproxy 的 CA（这条通路没有导出/挂载
      # CA 卷）。这不是生产形态——生产形态是正向代理 + 导出 CA，走 8080
      # 那一路；见 phase-1b-report.md 里的说明。
      - "127.0.0.1:8081:8081"
      # SiliconFlow 专用反向代理端口，原样复刻上面 TextIn 那一路——同样
      # 不是生产形态。addon.py::request() 按 flow.request.pretty_host 查
      # policy.yaml 白名单；mitmproxy 反向代理模式默认会把出站请求的 Host
      # 头改写成反代目标（api.siliconflow.cn），而不是保留客户端连接的
      # 127.0.0.1:8082（除非显式开 keep_host_header，这里没开）。这条链路
      # 与 TextIn 那条共享同一个前提，已经在这台代理上跑通过。
      - "127.0.0.1:8082:8082"
      # 2026-09-28：三个数据 MCP 的反向代理端口，同一个模式——回环明文进、TLS 出，
      # 凭据由 addon.py 按 policy.yaml 注入，业务进程只知道 127.0.0.1:<端口>。
      # 8083 Tushare 官方 MCP（token 注入 URL 参数）、8084 万得 Wind（Bearer）、
      # 8085 同花顺 iFinD（Authorization 头）。
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:8085:8085"
      # 2026-09-29：DeepSeek（表格描述等生成任务）反向代理端口，同一个模式，Bearer 由 addon 注入。
      - "127.0.0.1:8086:8086"
    # `command:` 只覆盖 Dockerfile ENTRYPOINT 之后的 CMD 部分，不是替换整条
    # 命令——ENTRYPOINT 已经是 `mitmdump --set block_global=false -s
    # /policy/addon.py`，这里只追加三个 --mode：显式声明 regular@8080（保留
    # 原有正向代理行为，其余供应商走这条）、reverse@8081（TextIn 专用）与
    # 新增的 reverse@8082（SiliconFlow 专用）。
    # 踩过的坑：如果在这里把 "mitmdump --set ... -s ..." 又完整写一遍，
    # 会被当成 ENTRYPOINT 后面多出来的参数，mitmdump 把它们全部解读成一个
    # 正则过滤表达式（"Only processing flows that match ..."），代理直接不转发。
    command:
      # 关掉 mitmdump 自带的逐请求输出：它会打印完整 URL，Tushare MCP 的 token 在查询串里，
      # 即使被截断也会漏出前缀（2026-09-28 实测）。请求日志只由 addon.py 记录，查询串已剥掉。
      - --set
      - flow_detail=0
      - --mode
      - regular@8080
      - --mode
      - reverse:https://api.textin.com@8081
      - --mode
      - reverse:https://api.siliconflow.cn@8082
      - --mode
      - reverse:https://api.tushare.pro@8083
      - --mode
      - reverse:https://mcp.wind.com.cn@8084
      - --mode
      - reverse:https://api-mcp.51ifind.com:8643@8085
      - --mode
      - reverse:https://api.deepseek.com@8086
    restart: unless-stopped

  # --- 阶段 4.1：Dagster 常驻（webserver + daemon）----------------------------------------
  # 两个进程共用同一个镜像（infra/dagster/Dockerfile）与同一份环境；运行 / 事件 / 调度状态存进
  # ParadeDB 的 `dagster` schema（迁移 024 建 schema，dagster.yaml 里 search_path=dagster）。
  # 镜像与环境里**没有供应商密钥**——它们只在 egress-proxy；这里只传非密钥配置与回环地址
  #（入口脚本把 127.0.0.1 改成服务名 egress-proxy）。
  dagster-webserver:
    build:
      context: ..
      dockerfile: infra/dagster/Dockerfile
    image: ragdemo-dagster:local
    container_name: ragdemo-dagster-ui
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/dagster_home/workspace.yaml"]
    environment: &dagster-env
      DAGSTER_PG_URL: postgresql://postgres:${POSTGRES_PASSWORD:-ragdemo}@paradedb:5432/ragdemo?options=-csearch_path%3Ddagster
      RAGDEMO_DSN: postgresql://postgres:${POSTGRES_PASSWORD:-ragdemo}@paradedb:5432/ragdemo
      RAGDEMO_BLOB_ROOT: /app/data/blob
      RAGDEMO_TUSHARE_MCP_URL: ${RAGDEMO_TUSHARE_MCP_URL:-}
      RAGDEMO_TUSHARE_REST_URL: ${RAGDEMO_TUSHARE_REST_URL:-}
      RAGDEMO_WIND_MCP_URL: ${RAGDEMO_WIND_MCP_URL:-}
      RAGDEMO_IFIND_MCP_BASE: ${RAGDEMO_IFIND_MCP_BASE:-}
      RAGDEMO_CNINFO_USER_AGENT: ${RAGDEMO_CNINFO_USER_AGENT:-}
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-}
      TEXTIN_BASE_URL: ${TEXTIN_BASE_URL:-}
      TEXTIN_MAX_PAGES_PER_RUN: ${TEXTIN_MAX_PAGES_PER_RUN:-}
      TEXTIN_COST_PER_PAGE_CNY: ${TEXTIN_COST_PER_PAGE_CNY:-}
      RAGDEMO_MONTHLY_BUDGET_CNY: ${RAGDEMO_MONTHLY_BUDGET_CNY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_KIND: ${ALERT_WEBHOOK_KIND:-}
    volumes:
      - ../data:/app/data
      # 开发环境：把工作区源码与配置只读挂进容器（镜像里 uv sync 装的是可编辑安装，指向 /app/packages），
      # 改代码后 `docker compose restart dagster-webserver dagster-daemon` 即生效，不必重建镜像
      #（重建要解包 ~366 MB，Windows 上耗时十几分钟）。生产部署去掉这两行，用镜像里烤进去的代码。
      - ../packages:/app/packages:ro
      - ../config:/app/config:ro
    ports:
      - "127.0.0.1:${RAGDEMO_DAGSTER_PORT:-3000}:3000"
    depends_on:
      paradedb:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:3000/server_info', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dagster-daemon:
    image: ragdemo-dagster:local
    container_name: ragdemo-dagster-daemon
    command: ["dagster-daemon", "run", "-w", "/dagster_home/workspace.yaml"]
    environment: *dagster-env
    volumes:
      - ../data:/app/data
      - ../packages:/app/packages:ro
      - ../config:/app/config:ro
    depends_on:
      paradedb:
        condition: service_healthy
      dagster-webserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  chromadata:
