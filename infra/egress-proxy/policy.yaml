# 出网白名单。密钥只在代理层注入，业务容器的环境变量中没有任何供应商密钥。
# 不在名单内的域名直接拒绝——即使某个依赖被投毒，它也无法把数据发到任意地址。
default_action: deny
log: full           # 记录 host / path / 状态码 / 字节数 / 耗时；不记录请求体

allowlist:
  - host: api.tushare.pro
    inject_credential: TUSHARE_TOKEN
    inject_as: body_json            # tushare REST 接口把 token 放在 JSON body 的 token 字段
    path_rules:
      - prefix: /mcp                # Tushare 官方 MCP：token 放在 URL 参数 ?token=
        inject_as: query
        query_param: token
  - host: mcp.wind.com.cn           # 万得 Wind MCP：财务数据（2026-09-28 选定）
    inject_credential: WIND_MCP_TOKEN
    inject_as: bearer
  - host: api-mcp.51ifind.com       # 同花顺 iFinD MCP：Authorization 头直接放 token，不带 Bearer
    inject_credential: IFIND_MCP_TOKEN
    inject_as: header
    headers: [Authorization]
  - host: data.sec.gov
    inject_credential: null
  - host: www.sec.gov
    inject_credential: null
  - host: www.cninfo.com.cn      # 公告查询（adr/0013）：官方披露平台，无需鉴权
    inject_credential: null
  - host: static.cninfo.com.cn   # 公告 PDF 下载（adr/0013）
    inject_credential: null
  - host: www.chinamoney.com.cn   # 人民币汇率中间价（阶段二）：官方公开，无需鉴权
    inject_credential: null
  - host: www1.hkexnews.hk       # 港交所披露易：港股公告全文（公告双源接入计划 Task 7）
    inject_credential: null      # 官方指定披露平台，无需鉴权
  - host: api.textin.com            # 文档解析（adr/0008）
    inject_credential: [TEXTIN_APP_ID, TEXTIN_SECRET_CODE]
    inject_as: header               # x-ti-app-id / x-ti-secret-code
    headers: [x-ti-app-id, x-ti-secret-code]
  - host: api.siliconflow.cn        # 嵌入与重排（adr/0004）
    inject_credential: EMBEDDING_API_KEY
    inject_as: bearer
  - host: api.deepseek.com          # 生成模型
    inject_credential: MODEL_API_KEY
    inject_as: bearer
  - host: parse-paddle             # 自托管 PaddleOCR（解析分级路由计划 T5）：内部网络，无凭据
    inject_credential: null

  # MCP 网关（windIFinD-mcp）：聚合 Tushare / 万得 / 同花顺 / AkShare / 财经新闻。
  # 它自己持有上游凭证，所以这里注入的是**访问网关本身**的凭据，不是数据商的。
  #
  # 故意不写死具体主机名：网关地址是部署配置，各环境不同；而且把一个尚未加鉴权的
  # 内部服务地址固化进已提交文件，等于扩大它的暴露面。部署时按实际地址取消注释。
  # - host: <你的网关主机名>
  #   inject_credential: MCP_GATEWAY_TOKEN
  #   inject_as: bearer
