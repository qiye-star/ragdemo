# Dagster 实例配置（阶段 4.1）：运行 / 事件 / 调度状态存进 ParadeDB 的 `dagster` schema，
# 与业务数据同一个库、不同 schema（迁移 024 建 schema，表由 dagster-postgres 自己建）。
# `search_path=dagster` 让 Dagster 的表落在这个 schema 里，不污染 core / asof。
storage:
  postgres:
    postgres_url:
      env: DAGSTER_PG_URL

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # 单进程串行是回填手册里写死的并发上限（infra/backfill.md §2）：
    # 供应商限速与冷却状态是全局的，并发只会互相挤占。
    max_concurrent_runs: 1

# 数据库偶发崩溃恢复（ParadeDB 后台进程问题，见验收记录 phase-8）期间作业会连接失败；
# 失败的 run 自动重试，避免一次瞬时故障就让当天分区缺数据。
run_retries:
  enabled: true
  max_retries: 2

telemetry:
  enabled: false   # 不向境外上报（CLAUDE.md §0）

retention:
  schedule:
    purge_after_days: 90
  sensor:
    purge_after_days:
      skipped: 7
      failure: 30
      success: -1
