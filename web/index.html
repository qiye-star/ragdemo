<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<!-- default-src 'none' 让「不依赖 CDN」从约定变成浏览器层面做不到违反；
     form-action 'none' 让这个页面结构上无法向任何地方提交表单（ADR-0010 推翻条件 1）。
     这个页面本身也没有一个 <form> 元素——两者互为印证，不是各写各的。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self';
               img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>内部诊断工具（非产品界面）· ragdemo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ADR-0010 后果 2：内部工具一旦好用就会被拿给外人看，固定标识提醒这一点。
     在 <main> 之外，任何视图重绘都碰不到它——不是靠约定，是靠 DOM 结构。 -->
<div id="banner" role="note">内部诊断工具，非产品界面 · 只读 · 仅内网 · 不出具任何结论</div>

<header id="asof-bar">
  <label for="asof-input">as_of</label>
  <input id="asof-input" type="datetime-local" step="1">
  <span class="dim">（本地时间，将按 UTC 处理）</span>
  <button id="asof-apply" type="button">应用时点</button>
  <button type="button" data-preset="now">现在</button>
  <button id="asof-jump-earliest" type="button" data-preset="earliest" hidden>跳到最早</button>
  <button id="asof-jump-latest" type="button" data-preset="latest" hidden>跳到最晚</button>
  <code id="asof-echo" class="mono" aria-live="polite">未选择</code>
  <span id="asof-hint" class="dim" aria-live="polite"></span>
</header>

<!-- 导航链接由 app.js 从视图注册表生成——这里不写死任何 <a>，
     加一个新视图只需要在 app.js 的 VIEWS 列表里加一行 import。 -->
<div id="shell">
  <nav id="nav" aria-label="视图"></nav>
  <main id="view"></main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
